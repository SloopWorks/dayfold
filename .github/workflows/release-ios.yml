# Dayfold iOS release train (ADR 0066).
# dev -> unsigned simulator app artifact; alpha/beta -> TestFlight upload;
# production -> App Store Connect build upload only (never submits for review).
name: Release iOS

on:
  push:
    tags: ["ios-alpha-v*", "ios-beta-v*", "ios-v*"]
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        type: choice
        options: [dev, alpha, beta, production]
      version:
        description: Semantic version (for example 1.0.0)
        required: true
        default: 1.0.0
        type: string

permissions:
  contents: read

concurrency:
  group: release-ios
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      SLOOPWORKS_PACKAGES_TOKEN: ${{ secrets.SLOOPWORKS_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          token: ${{ secrets.DEBUGDRAWER_REPO_TOKEN }}
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with: { distribution: temurin, java-version: "17" }

      - name: Derive channel and version
        id: derive
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            channel="$INPUT_CHANNEL"
            version="$INPUT_VERSION"
          else
            ref="$GITHUB_REF_NAME"
            case "$ref" in
              ios-alpha-v*) channel=alpha; version="${ref#ios-alpha-v}" ;;
              ios-beta-v*) channel=beta; version="${ref#ios-beta-v}" ;;
              ios-v*) channel=production; version="${ref#ios-v}" ;;
              *) echo "::error::unsupported iOS tag '$ref'"; exit 1 ;;
            esac
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be MAJOR.MINOR.PATCH"; exit 1
          fi
          case "$channel" in dev|alpha|beta|production) ;; *) exit 1 ;; esac
          {
            echo "channel=$channel"
            echo "version=$version"
            # 1.0.0 (1001) is the validated local bootstrap build in TestFlight.
            # Start this new workflow's counter above it so run 1 cannot collide.
            echo "build=$((GITHUB_RUN_NUMBER + 2000))"
          } >> "$GITHUB_OUTPUT"

      - name: Materialize Firebase configuration
        env:
          PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$PLIST_B64"
          printf '%s' "$PLIST_B64" | base64 -D > apps/iosApp/GoogleService-Info.plist

      - name: Generate the Xcode project
        run: |
          set -euo pipefail
          brew install xcodegen
          cd apps/iosApp
          xcodegen generate

      - name: Verify shared client
        working-directory: apps
        run: ./gradlew --no-daemon :client:desktopTest :ui:desktopTest

      - name: Build dev simulator app
        if: steps.derive.outputs.channel == 'dev'
        env:
          VERSION: ${{ steps.derive.outputs.version }}
          BUILD: ${{ steps.derive.outputs.build }}
        run: |
          set -euo pipefail
          xcodebuild -project apps/iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/iosApp.app" \
            "$RUNNER_TEMP/dayfold-ios-simulator.zip"

      - name: Install temporary distribution signing
        if: steps.derive.outputs.channel != 'dev'
        env:
          CERT_B64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$CERT_B64" && test -n "$CERT_PASSWORD" && test -n "$PROFILE_B64"
          keychain="$RUNNER_TEMP/dayfold-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$CERT_B64" | base64 -D > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$PROFILE_B64" | base64 -D > "$RUNNER_TEMP/dayfold.mobileprovision"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/distribution.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychain -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/dayfold.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/6551db5a-4314-4308-ae75-900dd65a5b4a.mobileprovision"

      - name: Archive and export signed IPA
        if: steps.derive.outputs.channel != 'dev'
        env:
          VERSION: ${{ steps.derive.outputs.version }}
          BUILD: ${{ steps.derive.outputs.build }}
        run: |
          set -euo pipefail
          xcodebuild -project apps/iosApp/iosApp.xcodeproj -scheme iosApp -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Dayfold.xcarchive" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Dayfold.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist apps/iosApp/ExportOptions.plist

      - name: Verify signed App Store payload
        if: steps.derive.outputs.channel != 'dev'
        env:
          VERSION: ${{ steps.derive.outputs.version }}
          BUILD: ${{ steps.derive.outputs.build }}
        run: |
          set -euo pipefail
          ipa="$(find "$RUNNER_TEMP/export" -name '*.ipa' -type f -print -quit)"
          test -n "$ipa"
          verify_dir="$RUNNER_TEMP/verify-ipa"
          mkdir "$verify_dir"
          ditto -x -k "$ipa" "$verify_dir"
          app="$(find "$verify_dir/Payload" -maxdepth 1 -name '*.app' -type d -print -quit)"
          test -n "$app"

          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --entitlements :- "$app" > "$verify_dir/entitlements.plist" 2>/dev/null
          security cms -D -i "$app/embedded.mobileprovision" > "$verify_dir/profile.plist"

          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = com.sloopworks.dayfold
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")" = "$BUILD"
          test "$(/usr/libexec/PlistBuddy -c 'Print :application-identifier' "$verify_dir/entitlements.plist")" = 2XAXFD3872.com.sloopworks.dayfold
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.team-identifier' "$verify_dir/entitlements.plist")" = 2XAXFD3872
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.applesignin:0' "$verify_dir/entitlements.plist")" = Default
          test "$(/usr/libexec/PlistBuddy -c 'Print :get-task-allow' "$verify_dir/entitlements.plist")" = false
          test "$(/usr/libexec/PlistBuddy -c 'Print :Name' "$verify_dir/profile.plist")" = 'Dayfold App Store CI'
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$verify_dir/profile.plist")" = 2XAXFD3872.com.sloopworks.dayfold
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$app/Info.plist")"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :NSCalendarsFullAccessUsageDescription' "$app/Info.plist")"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :NSCalendarsUsageDescription' "$app/Info.plist")"
          test "$(lipo -archs "$app/iosApp")" = arm64
          test -f "$app/PrivacyInfo.xcprivacy"
          echo "::notice::verified signed App Store IPA $VERSION ($BUILD), protected-resource strings, Apple sign-in, privacy manifest, and distribution profile"

      - name: Upload build to App Store Connect
        if: steps.derive.outputs.channel != 'dev'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          CHANNEL: ${{ steps.derive.outputs.channel }}
        run: |
          set -euo pipefail
          test -n "$ASC_KEY_ID" && test -n "$ASC_ISSUER_ID" && test -n "$ASC_PRIVATE_KEY"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          ipa="$(find "$RUNNER_TEMP/export" -name '*.ipa' -type f -print -quit)"
          test -n "$ipa"
          xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "::notice::uploaded $CHANNEL build; no App Review submission or public release was performed"

      - name: Assign TestFlight testing group
        if: steps.derive.outputs.channel == 'alpha' || steps.derive.outputs.channel == 'beta'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          CHANNEL: ${{ steps.derive.outputs.channel }}
          VERSION: ${{ steps.derive.outputs.version }}
          BUILD: ${{ steps.derive.outputs.build }}
        run: node scripts/asc-testflight.mjs assign-build "$CHANNEL" "$VERSION" "$BUILD"

      - name: Keep the exact iOS build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dayfold-ios-${{ steps.derive.outputs.channel }}-${{ steps.derive.outputs.version }}-${{ steps.derive.outputs.build }}
          path: |
            ${{ runner.temp }}/dayfold-ios-simulator.zip
            ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing material
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/dayfold.mobileprovision"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/6551db5a-4314-4308-ae75-900dd65a5b4a.mobileprovision"
          rm -f apps/iosApp/GoogleService-Info.plist
          rm -rf "$RUNNER_TEMP/verify-ipa"
          security delete-keychain "$RUNNER_TEMP/dayfold-signing.keychain-db" 2>/dev/null || true
