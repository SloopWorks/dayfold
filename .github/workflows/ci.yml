name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (vitest + Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fad_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fad_test
      # GitHub Packages credentials for @sloopworks/swip-* (root .npmrc reads this env
      # var; repo secret = read:packages PAT — the same one the Gradle lanes use).
      NODE_AUTH_TOKEN: ${{ secrets.SLOOPWORKS_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: npm ci
      - name: routine contract schemas and fixtures
        run: npm run test:routine-schema
      - name: codegen is up to date
        # `npm run codegen` emits BOTH the TS (zod) types the API imports AND the
        # Kotlin (quicktype) types the CLI/client source. Guard both — the Kotlin
        # output was previously unguarded, so a schema change could land with a stale
        # Content.kt (ADR 0038/0039 add many fields → drift risk). quicktype codegen
        # is deterministic (verified), so a clean tree must match byte-for-byte.
        run: |
          npm run codegen
          git diff --exit-code apps/api/src/generated || \
            { echo "::error::generated TS types are stale — run npm run codegen"; exit 1; }
          git diff --exit-code packages/schema/kotlin-gen/Content.kt || \
            { echo "::error::generated Kotlin types (packages/schema/kotlin-gen/Content.kt) are stale — run npm run codegen"; exit 1; }
      - name: api bundle is up to date
        # The committed esbuild artifact (apps/api/api/index.js) IS the Vercel function.
        # It drifted from src for ~130 PRs (#180) → prod served stale code. esbuild is
        # deterministic and `npm ci` pins the version, so a rebuild must match byte-for-byte.
        working-directory: apps/api
        run: |
          npm run build:fn
          git diff --exit-code api/index.js || \
            { echo "::error::committed Vercel bundle (apps/api/api/index.js) is stale — run 'npm run build:fn' in apps/api and commit it"; exit 1; }
      - name: api tests
        working-directory: apps/api
        run: npx vitest run

  cli:
    name: CLI (Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-jvm
      - working-directory: apps/cli
        run: ./gradlew --no-daemon build
      - name: Failing tests (on failure)
        if: failure()
        run: bash scripts/ci-test-failures.sh apps/cli
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-cli
          path: |
            apps/cli/build/test-results/**/*.xml
            apps/cli/build/reports/tests/**
          if-no-files-found: ignore

  client:
    name: Client core + feed UI (Compose, headless)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Reads SWIP packages and the private DebugDrawer source submodule.
    env:
      SLOOPWORKS_PACKAGES_TOKEN: ${{ secrets.SLOOPWORKS_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.DEBUGDRAWER_REPO_TOKEN }}
      - uses: ./.github/actions/setup-jvm
      # Cheap guard: every commonMain `expect` has an `actual` per platform (android/
      # desktop/ios). CI doesn't compile iOS, so a missing iosMain actual would merge
      # undetected (see #225). Pure grep — fails fast before the gradle build.
      - name: expect/actual parity (incl. iOS)
        run: bash scripts/check-expect-actual.sh
      # Parity with SWIP's `no-direct-console` eslint rule: client Kotlin must log
      # via com.sloopworks.dayfold.client.Log, not raw println/android.util.Log.
      - name: no-direct-console gate
        run: bash scripts/check-no-direct-console.sh
      # TASK-KMP consolidated :client into the single apps/ Gradle build —
      # apps/client no longer has its own wrapper. Run the module task from apps/.
      # ADR 0047 split the Compose UI + render/snapshot tests into :ui — run both
      # (:client = logic tests; :ui = render/UI + CL-SNAP golden/snapshot tests).
      # Step-level cap, deliberately BELOW the job's 25-minute cap. Gradle here has
      # repeatedly been observed to run ~18 minutes without finishing. When that
      # happens the JOB times out, which CANCELS the remaining steps — so the golden
      # dashboard is never rendered and never uploaded, and a red run yields no
      # diagnostics at all. Failing the STEP instead leaves ~7 minutes for the
      # `if: failure()` steps below (the dashboard run takes ~70s), so a hang still
      # produces the artifacts.
      # The earlier reading of this hang — "keeps running AFTER `:ui:desktopTest
      # FAILED`, suspect --no-daemon not tearing down after a failed task" — is WRONG,
      # disproved by run 32552296539: nothing had failed. `:client:desktopTest` and
      # `:ui:desktopTest` were both still running at the cap, 668 tests reported, zero
      # failures. So it hangs during a CLEAN run too, and a failed task is not the
      # trigger. Still undiagnosed; it does not reproduce locally (~7 min there),
      # which points at something runner-specific.
      # `verifyCommonMainContentDbMigration` is SQLDelight's check that applying the
      # .sqm chain to an old DB reproduces the schema `Content.sq` creates fresh. It has
      # been enabled in `apps/client/build.gradle.kts` all along but never ran, because it
      # is wired to `:client:build` and CI only ever runs `:client:desktopTest`. It was
      # failing: three tables had columns that reached the fresh schema with no migration,
      # so fresh installs were correct while upgrading devices silently were not. ~9s.
      - working-directory: apps
        timeout-minutes: 18
        run: >-
          ./gradlew --no-daemon
          :client:verifyCommonMainContentDbMigration
          :client:desktopTest :ui:desktopTest :swip-wiring:desktopTest
      # WHICH test failed, on the run's summary page. Gradle's own failure output names
      # only the task (":client:desktopTest FAILED"); identifying the failing case among
      # ~1000 previously meant downloading the raw log (~160 KB for #390). This reads the
      # JUnit XML Gradle already writes and posts the names + messages to the job summary.
      # Runs BEFORE the dashboard step because it costs ~1s and the dashboard costs ~70s —
      # after an 18-minute step timeout only ~7 minutes of job budget remain.
      # Diagnostic only: it always exits 0, so it can never mask or become the failure.
      - name: Failing tests (on failure)
        if: failure()
        run: bash scripts/ci-test-failures.sh apps
      # The summary above gives the failing test names and first lines; the XML/HTML here
      # carries the full stack traces and stdout for a case the summary can't explain.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-client
          path: |
            apps/*/build/test-results/**/*.xml
            apps/*/build/reports/tests/**
          if-no-files-found: ignore
      # On golden failure: render the batch dashboard (per-shot image + magenta diff +
      # verdict, self-contained index.html) and upload it, so a failed PR run gives
      # clickable visual diffs without a local repro. `|| true`: the dashboard run
      # exits 1 on the same mismatches that failed the gate — we want the artifact.
      - name: Golden dashboard (on failure)
        if: failure()
        working-directory: apps
        run: ./gradlew --no-daemon :ui:snapshotUi -PsnapshotArgs="--batch snapshot-shots.json --golden-dir src/desktopTest/resources/snapshots/linux --dashboard" || true
      - name: Upload snapshot dashboard
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-dashboard
          path: apps/ui/.rk-snapshots
          if-no-files-found: ignore
          # `.rk-snapshots` is a DOT-directory, and upload-artifact@v4 excludes hidden
          # paths by default — so this step silently uploaded nothing on every golden
          # failure since it was added ("No files were found with the provided path"),
          # leaving red golden runs with no visual diff and no re-recordable PNGs.
          include-hidden-files: true

  android:
    name: Android app (debug + release boundary)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Reads SWIP packages and the private DebugDrawer source submodule.
    env:
      SLOOPWORKS_PACKAGES_TOKEN: ${{ secrets.SLOOPWORKS_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.DEBUGDRAWER_REPO_TOKEN }}
      - uses: ./.github/actions/setup-jvm
      # google-services.json is gitignored + per-env (the real config is a release
      # secret). For a compile-only smoke a stub is enough — it satisfies the gms
      # plugin without shipping real Firebase config (same stub release-android.yml
      # falls back to). Google sign-in is non-functional here — irrelevant to a build.
      - name: Stub google-services.json (compile-only)
        run: |
          cat > apps/androidApp/google-services.json <<'JSON'
          {
            "project_info": { "project_number": "000000000000", "project_id": "dayfold-stub", "storage_bucket": "dayfold-stub.appspot.com" },
            "client": [ {
              "client_info": { "mobilesdk_app_id": "1:000000000000:android:0000000000000000", "android_client_info": { "package_name": "com.sloopworks.dayfold" } },
              "oauth_client": [ { "client_id": "000000000000-stub.apps.googleusercontent.com", "client_type": 3 } ],
              "api_key": [ { "current_key": "AIzaSyStubStubStubStubStubStubStubStub00" } ],
              "services": { "appinvite_service": { "other_platform_oauth_client": [ { "client_id": "000000000000-stub.apps.googleusercontent.com", "client_type": 3 } ] } }
            }, {
              "client_info": { "mobilesdk_app_id": "1:000000000000:android:0000000000000001", "android_client_info": { "package_name": "com.sloopworks.dayfold.dev" } },
              "oauth_client": [ { "client_id": "000000000000-stub.apps.googleusercontent.com", "client_type": 3 } ],
              "api_key": [ { "current_key": "AIzaSyStubStubStubStubStubStubStubStub00" } ],
              "services": { "appinvite_service": { "other_platform_oauth_client": [ { "client_id": "000000000000-stub.apps.googleusercontent.com", "client_type": 3 } ] } }
            } ],
            "configuration_version": "1"
          }
          JSON
      - name: Ensure the Android platform is installed (compileSdk 37 / Android 16)
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes 2>/dev/null | "$SDK" --licenses >/dev/null 2>&1 || true
          "$SDK" "platforms;android-37" "build-tools;36.0.0" >/dev/null 2>&1 \
            || "$SDK" "platforms;android-37.0" "build-tools;36.0.0" >/dev/null 2>&1 || true
      # Builds the real Compose app with the shared drawer in debug and the no-op facade
      # in release. The release check verifies both the resolved graph and final AAB DEX.
      - name: Build debug + release
        working-directory: apps
        run: ./gradlew --no-daemon :androidApp:assembleDebug :androidApp:bundleRelease
      - name: Shared debug drawer release boundary
        run: bash scripts/check-debugdrawer-release.sh

  naming-guard:
    name: No legacy com.familyai package (ADR 0026)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: reject com.familyai / FAMILYAI_API in code
        run: |
          if git grep -nE 'com\.familyai|FAMILYAI_API' -- apps packages ':!**/build/**'; then
            echo "::error::legacy com.familyai / FAMILYAI_API found — package is com.sloopworks.dayfold per ADR 0026"
            exit 1
          fi

  firebase-emulator:
    name: API — real Firebase Auth Emulator (S2, ADR 0027)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fad_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fad_test
      FIREBASE_PROJECT_ID: dayfold-test
      # @sloopworks/swip-* come from GitHub Packages — this job's `npm ci` needs auth too
      # (same as the `api` job). Without it, npm ci 401s downloading swip-sentry.
      NODE_AUTH_TOKEN: ${{ secrets.SLOOPWORKS_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-jvm   # JDK (the Auth emulator runs on the JVM)
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: npm ci
      - name: codegen (generated types the API imports)
        run: npm run codegen
      - name: auth emulator + real-path integration test
        working-directory: apps/api
        # emulators:exec starts the Auth emulator, exports FIREBASE_AUTH_EMULATOR_HOST,
        # runs the command, then tears it down. The integration test is skipIf-gated on
        # that env var, so it only executes inside this wrapper.
        run: >-
          npx --yes firebase-tools emulators:exec --only auth --project dayfold-test
          "npx vitest run test/auth-firebase-emulator.test.ts"
